<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Carnet digital</title>
<!-- Web app en iPhone: pantalla completa, ícono y nombre propios -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet">
<meta name="theme-color" content="#26251c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    --page: rgb(84, 89, 62);
    --surface: rgb(84, 89, 62);
    --band: #26251c;
    --text: #bff3ea;      /* celeste aguamarina, tomado de la foto */
    --muted: #aee8de;
    --nav: #dcdcd8;       /* blanco opaco para la navegación */
    --lime: #b6ef24;
    --teal: #4e7b7a;
    --ink: #3f551d;
    --warn: #ffcf33;
  }
  *, *::before, *::after { box-sizing: inherit; }
  /* App a pantalla completa: nada se desplaza, nada se amplía */
  /* En modo app del iPhone, 100% y "fixed" terminan ~1 cm antes del borde.
     100vh / 100lvh sí cubren la pantalla completa. */
  html, body {
    margin: 0;
    height: 100vh; height: 100lvh;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--surface);
  }
  body {
    font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    touch-action: none;                  /* sin pellizcar para ampliar ni arrastrar */
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  .phone {
    position: relative;
    width: 100%; max-width: 440px;
    height: 100vh; height: 100lvh;
    margin: 0 auto;
    background: var(--surface);
    overflow: hidden;
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);   /* debajo de la hora y la batería */
    /* franja de la hora y la batería con el color oscuro del centro del carnet */
    background: linear-gradient(to bottom,
      var(--band) env(safe-area-inset-top, 0px),
      var(--surface) env(safe-area-inset-top, 0px));
  }
  .watermark {
    position: absolute; inset: 0; pointer-events: none; z-index: 5;
    display: grid; place-items: center; overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .institution {
    text-align: center; color: var(--lime);
    font-size: 15px; font-weight: 500; margin: 6px 16px 2px;
  }
  .name-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 22px 0;
  }
  .name-row h1 { font-size: 24px; font-weight: 600; margin: 0; }
  .switch {
    width: 62.6px; height: 62.6px; border-radius: 15.1px; border: 0;
    background: var(--teal); color: #fff; cursor: default;
    display: grid; place-items: center; overflow: hidden; padding: 0;
    box-shadow: 0 4px 10px rgba(0,0,0,.3);
  }
  .switch-logo { width: 36px; height: 36px; display:block; }
  .switch-logo path, .switch-logo line, .switch-logo polyline {
    stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
  }
  .switch:focus-visible, .nav button:focus-visible { outline: 3px solid var(--lime); outline-offset: 3px; }
  .band { position: relative; margin-top: 10px; }
  .band svg.wave { display: block; width: 100%; height: 70px; margin-bottom: -1px; }
  .band-body { background: var(--band); padding: 0 20px 30px; text-align: center; }
  .avatar {
    position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    width: 176px; height: 176px; border-radius: 50%;
    background: #e9e7e4; border: 8px solid var(--band);
    display: grid; place-items: center; overflow: hidden;
  }
  .role { font-size: 22px; font-weight: 500; padding-top: 112px; margin: 0 0 8px; }
  .divider { height: 1px; background: rgba(255,255,255,.3); margin: 0 0 10px; }
  .meta { font-size: 21px; font-weight: 500; line-height: 1.5; margin: 0; }
  .meta small { display: block; color: var(--warn); font-size: 12px; font-weight: 500; margin-top: 6px; min-height: 18px; }
  .band-bottom { display: block; width: 100%; height: 20px; margin-top: -1px; }
  .nav {
    display: grid; grid-template-columns: repeat(4, 1fr);
    padding: 6px 8px max(6px, calc(env(safe-area-inset-bottom, 0px) - 8px));
    flex-shrink: 0;
  }
  .nav button {
    background: none; border: 0; color: var(--nav); font: inherit; font-size: 14px;
    display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 4px;
  }
  .nav .icon { width: 62px; height: 36px; border-radius: 12px; display: grid; place-items: center; }
  .nav button[aria-current="page"] .icon { background: var(--lime); color: #1a2a05; }
  .nav button[aria-current="page"] { font-weight: 600; }
</style>

<style id="supplied-logo-style">
  .switch {
    width: 62.6px !important;
    height: 62.6px !important;
    padding: 0 !important;
    border-radius: 15.1px !important;
    overflow: hidden !important;
    background: #15605a !important;   /* mismo fondo del logo */
    display: grid !important;
    place-items: center !important;
  }
  .switch-logo-image {
    /* el símbolo blanco ocupa ~74% de la imagen: 27.8px → ~21px,
       la altura de la G mayúscula del nombre */
    width: 33.4px !important;
    height: 33.4px !important;
    display: block !important;
    object-fit: cover !important;
  }
</style>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

<style id="qr-style">
  .qr-wrap{
    flex:1; min-height:0; padding:4px 0;           /* ocupa el espacio entre la franja y la barra */
    display:flex; justify-content:center; align-items:center;
    container-type:size;
  }
  .qr-card{
    position:relative;
    /* ancho y alto explícitos: en iPhone aspect-ratio dejaba lo blanco más alto que el anillo */
    width:200px; height:200px;      /* respaldo para iPhone con iOS viejo */
    --lado: min(72cqw, 310px, calc(100cqh - 14px));
    width:var(--lado); height:var(--lado);
    flex-shrink:0;
    padding:14px;
    background:#f7f7f3;
    border-radius:16px;
    box-shadow:0 2px 5px rgba(0,0,0,.16);
  }
  /* Anillo de recarga: sentido horario desde el centro superior.
     Va centrado sobre el borde de la tarjeta, así se monta un poco sobre lo blanco. */
  .timer{
    position:absolute; inset:-6px;
    width:calc(100% + 12px); height:calc(100% + 12px);
    pointer-events:none; overflow:visible; z-index:3;
  }
  .timer .pista{ fill:none; stroke:rgba(127,179,23,.18); stroke-width:5; }
  .timer .progreso{
    fill:none; stroke:#7fb317; stroke-width:5; stroke-linecap:round;
    stroke-dasharray:100 100; stroke-dashoffset:100;
  }
  #qr{ width:100%; height:100%; display:block; overflow:hidden; }
  #qr .module{ fill:#27461f; }
  #qr .finder-outer{ fill:none; stroke:#27461f; }
  #qr .finder-inner{ fill:#27461f; }
  @media (max-height: 700px){
    .institution{ margin-top:10px; }
    .name-row{ padding-top:6px; }
    .band{ margin-top:10px; }
    .avatar{ width:128px; height:128px; }
    .role{ padding-top:82px; }
    .band-body{ padding-bottom:20px; }
    .band-bottom{ height:28px; }
  }
</style>

<main class="phone" aria-label="Carnet digital">

  <p class="institution" id="institution">Universidad Industrial de Santander</p>

  <div class="name-row">
    <h1 id="name">Nombre Apellido</h1>

  /* Genera contenido diferente cada ciclo */
  function nuevoCodigo(){
    const bytes = new Uint8Array(28);   /* 28 bytes → QR de 45×45 puntos, más denso */
    crypto.getRandomValues(bytes);
    return "UIS-" + Array.from(bytes,b =>
      b.toString(16).padStart(2,"0")
    ).join("").toUpperCase();
  }
  
  function esFinder(r,c,n){
    return (r<7 && c<7) ||
           (r<7 && c>=n-7) ||
           (r>=n-7 && c<7);
  }
  
  /*
   * Dibuja el QR buscando el aspecto de la referencia:
   * - módulos verde oscuro
   * - módulos ligeramente redondeados
   * - ojos cuadrados con esquinas suavizadas
   * - logo central
   */
  function dibujarQR(texto){
    const q = qrcode(0,"H");
    q.addData(texto);
    q.make();
  
    const n = q.getModuleCount();
    const margen = 0;   /* margen blanco extra alrededor del QR, en puntos */
    const total = n + margen*2;
  
    /*
     * El hueco central es suficientemente pequeño para conservar
     * la apariencia de QR denso de la foto y la tolerancia H.
     */
    const hueco = 15;     /* lado del cuadro blanco central, en puntos */
    const ini = Math.floor((n-hueco)/2);
    const fin = ini+hueco;
  
    /* Matriz de puntos oscuros: se llena primero y se dibuja al final */
    const oscuro = Array.from({length:n}, () => new Array(n).fill(false));

    for(let r=0;r<n;r++){
      for(let c=0;c<n;c++){
        if(!q.isDark(r,c)) continue;
        if(esFinder(r,c,n)) continue;
        if(r>=ini && r<fin && c>=ini && c<fin) continue;
        oscuro[r][c] = true;
      }
    }

    /* Tamaño de los ojos de las esquinas (1 = tamaño estándar) */
    const ESCALA_OJO = 0.85;   /* con 45 puntos, se ve del mismo tamaño que antes */
    const V = 7*ESCALA_OJO;               /* lado visible del ojo */
  
    /*
     * Al achicar los ojos queda espacio libre a su alrededor. Se rellena
     * con puntos para que entre cada ojo y los puntos quede 1 solo punto
     * de separación.
     */
    let semilla = 0;
    for(const ch of texto) semilla = Math.imul(semilla ^ ch.charCodeAt(0), 16777619);
    function relleno(r,c){
      let h = semilla ^ Math.imul(r+1, 73856093) ^ Math.imul(c+1, 19349663);
      h = Math.imul(h ^ (h>>>16), 0x45d9f3b);
      h = Math.imul(h ^ (h>>>16), 0x45d9f3b);
      return ((h ^ (h>>>16)) & 1) === 1;
    }
    /* Celdas de la zona de cada ojo que quedan a más de 1 punto de él */
    /* primera fila/columna de puntos a 1 punto de distancia del ojo */
    const PRIMERA = Math.ceil(V + 0.85);
    function enZona(rl,cl){
      return rl<=7 && cl<=7 && Math.max(rl,cl)>=PRIMERA;
    }
    function esSeparador(r,c){
      return enZona(r,c) ||             /* sup. izq. */
             enZona(r,n-1-c) ||         /* sup. der. */
             enZona(n-1-r,c);           /* inf. izq. */
    }
    for(let r=0;r<n;r++){
      for(let c=0;c<n;c++){
        if(esSeparador(r,c) && relleno(r,c)) oscuro[r][c] = true;
      }
    }
  
    /*
     * Cada punto es un cuadrito casi del tamaño de su celda: entre
     * vecinos queda una línea muy fina, así se notan los cuadritos
     * pero sin verse sueltos.
     */
    const SEP = 0.02;                     /* separación entre cuadritos */
    const RADIO = 0.3;                    /* redondeo de cada cuadrito (0.46 = círculo) */
    let modules = "";
    for(let r=0;r<n;r++){
      for(let c=0;c<n;c++){
        if(!oscuro[r][c]) continue;
        modules += `<rect class="module" x="${c+margen+SEP/2}" y="${r+margen+SEP/2}"
          width="${1-SEP}" height="${1-SEP}" rx="${RADIO}"/>`;
      }
    }

    /* x0,y0 = esquina superior izquierda visible del ojo */
    function finder(x0,y0){
      const k = ESCALA_OJO;
      const trazo = 1*k;
      const ext = V - trazo;
      const int = 3*k;
      const cx = x0 + V/2, cy = y0 + V/2;
      return `
        <rect class="finder-outer"
          x="${x0+trazo/2}" y="${y0+trazo/2}" width="${ext}" height="${ext}"
          rx="${.65*k}" style="stroke-width:${trazo}" />
        <rect class="finder-inner"
          x="${cx-int/2}" y="${cy-int/2}" width="${int}" height="${int}"
          rx="${.35*k}" />`;
    }
  
    /* Hueco blanco central donde va el logo */
    const TAM_LOGO = 11; /* tamaño del logo, en puntos */
    const hx = margen + ini, hy = margen + ini;
    const logoSVG = LOGO
      ? `<image href="${LOGO}" x="${hx+(hueco-TAM_LOGO)/2}" y="${hy+(hueco-TAM_LOGO)/2}"
           width="${TAM_LOGO}" height="${TAM_LOGO}"
           preserveAspectRatio="xMidYMid meet" />`
      : "";
  
    svg.setAttribute("viewBox",`0 0 ${total} ${total}`);
  
    svg.innerHTML = `
      <g>
        ${modules}
        ${finder(margen+.08, margen+.08)}
        ${finder(margen+n-.08-V, margen+.08)}
        ${finder(margen+.08, margen+n-.08-V)}
      </g>
  
      ${logoSVG}
    `;
  }
  
  const reducirMovimiento = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Renovación automática */
  let inicio = performance.now();
  
  function ciclo(t){
    const transcurrido = (t-inicio)/1000;
  
    if(transcurrido >= DURACION){
      inicio=t;
      dibujarQR(nuevoCodigo());
    }
  
    /* Llena el anillo de 0 a 100 en sentido horario */
    const avance = reducirMovimiento ? 1 : Math.min(((t-inicio)/1000)/DURACION,1);
    progreso.style.strokeDashoffset = 100 - avance*100;
    /* con punta redonda, un trazo de largo 0 se vería como un punto */
    progreso.style.opacity = avance < 0.01 ? 0 : 1;
  
    requestAnimationFrame(ciclo);
  }
  
  dibujarQR(nuevoCodigo());
  requestAnimationFrame(ciclo);
  </script>
<script>
  /* Sin zoom: pellizco, doble toque y gestos de iOS */
  ["gesturestart","gesturechange","gestureend"].forEach(ev =>
    document.addEventListener(ev, e => e.preventDefault(), {passive:false}));
  document.addEventListener("touchmove", e => {
    if (e.touches.length > 1 || (e.scale !== undefined && e.scale !== 1)) e.preventDefault();
  }, {passive:false});
  let ultimoToque = 0;
  document.addEventListener("touchend", e => {
    const ahora = Date.now();
    if (ahora - ultimoToque < 350) e.preventDefault();
    ultimoToque = ahora;
  }, {passive:false});
  document.addEventListener("dblclick", e => e.preventDefault(), {passive:false});

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
